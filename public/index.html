<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>銀月大陸 Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen game. HUD strip, map canvas fills the middle, log, five thumb buttons. Deliberate single night theme. */
:root{
  --bg:#0d100e;--panel:#191e1a;--edge:#3b3427;--gold:#d8b25a;--parch:#ece2c8;--dim:#9b937f;
  --hp:#c4433a;--mp:#3f74c8;--xp:#8cb84a;--danger:#e0533f;
  --pix:"DotGothic16","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select{touch-action:manipulation}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--parch);font-family:var(--pix);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding-block:8px}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:linear-gradient(#1f251f,#151a16);border:2px solid var(--edge);padding:7px 10px}
.who{display:grid;gap:1px}
.lv{font-size:15px;color:var(--gold);white-space:nowrap}
.cls{font-size:10px;color:var(--dim);letter-spacing:.1em}
.bars{display:grid;gap:4px;min-width:0}
.bar{position:relative;height:12px;background:#080a08;border:1px solid #000;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;display:block;transition:width .15s}
.bar>span{position:relative;display:block;font-size:10px;line-height:11px;text-align:center;color:#fff;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
#hpF{background:linear-gradient(#e0584d,var(--hp))}#mpF{background:linear-gradient(#5b8fe0,var(--mp))}#xpF{background:linear-gradient(#a6d65e,var(--xp))}
.bar.xp{height:5px}
.gold{font-size:12px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.gold b{font-weight:400;color:var(--parch);display:block;font-size:14px}
#stage{position:relative;flex:1;min-height:0;border:2px solid var(--edge);background:#060806;overflow:hidden}
#cv{display:block;touch-action:none}

.acts{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.skpad{position:absolute;right:8px;bottom:8px;width:206px;height:224px;z-index:3;pointer-events:none}
.skpad .btn{position:absolute;pointer-events:auto;width:56px;height:56px;border-radius:50%;padding:0 3px;background:rgba(27,31,25,.8);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;line-height:1.1}
.skpad .btn small{font-size:8px;margin-top:1px}
#bAtk{right:0;bottom:0;width:80px!important;height:80px!important;font-size:15px!important;border-color:#c49a3a!important;background:rgba(74,48,18,.82)!important}
.skpad .btn.sk{position:absolute}
#bS0{right:88px;bottom:2px}#bS1{right:74px;bottom:70px}#bS2{right:10px;bottom:90px}#bPot{right:10px;bottom:158px}
.fbtn{position:absolute;right:8px;bottom:240px;z-index:3;padding:5px 8px;font-size:11px;background:rgba(27,31,25,.8)}
#log{position:absolute;left:6px;bottom:6px;width:min(52%,440px);max-height:100px;overflow:hidden;pointer-events:none;z-index:2;font-size:12px;line-height:16px;padding:4px 6px;
  background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.5) 30%);text-shadow:0 1px 1px #000}
#joy{display:none;position:absolute;left:14px;bottom:14px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22);z-index:3;touch-action:none}
#joyK{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(232,196,106,.35);border:2px solid rgba(232,196,106,.7)}
body.touch{padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
body.touch #app{gap:4px;padding-block:4px}
body.touch #joy{display:block;pointer-events:none;opacity:.55;transition:opacity .15s}
body.touch #joy.act{opacity:1}
#joyZone{display:none;position:absolute;left:0;bottom:0;width:52%;height:46%;z-index:2;touch-action:none}
body.touch #joyZone{display:block}
body.touch #log{bottom:150px;width:64%;max-height:82px}
body.touch #fChat{display:none}
body.touch.chatOpen #fChat{display:flex}
body:not(.touch) #bChat{display:none}
body.touch .acts{grid-template-columns:repeat(7,1fr);gap:3px}
body.touch .acts .btn{padding:6px 0;font-size:12px}
body:not(.touch) .acts{grid-template-columns:repeat(6,1fr)}
.btn.sk{position:relative;overflow:hidden;border-color:#5a6e4a}
.btn.sk .sn{position:relative;z-index:1}.btn.sk small{position:relative;z-index:1}
.btn.sk .cdv{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.62);pointer-events:none}
.btn.sk.lock{opacity:.42;border-color:var(--edge)}
.btn.sk.ready{border-color:#9fbf6a;box-shadow:inset 0 0 8px rgba(159,191,106,.25)}
.uic{display:block;width:32px;height:32px;background-image:var(--uisheet);background-repeat:no-repeat;image-rendering:pixelated}
.skpad .btn .uic{width:34px;height:34px;flex:none}
.skpad .btn.sk .sn{display:none}
#bAtk .uic{width:44px;height:44px}#bAtk span{font-size:12px;margin-top:-2px}
.uic.mi{width:22px;height:22px;margin:0 auto 2px}
.uic.gi{width:20px;height:20px;display:inline-block;vertical-align:middle;margin-right:2px}
.hud{background:linear-gradient(#2a2a22,#15160f)!important;border-image:linear-gradient(#b89a58,#5a4a2a) 1!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.5)}
.lv{text-shadow:0 0 6px rgba(232,196,106,.45)}
.bar{border-radius:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.bar>i{box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.acts .btn{background:linear-gradient(#30342a,#191c16);border-color:#4a4636;border-radius:4px}
.acts .btn small{display:none}
.skpad .btn{box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06)}
.skpad .btn.sk.ready{box-shadow:0 0 10px rgba(159,191,106,.55),inset 0 0 0 1px rgba(255,255,255,.1)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.btn.chip{padding:6px 9px;font-size:12px;border-radius:14px}.btn.chip small{display:inline;font-size:10px;margin:0}
.bcell .lk{position:absolute;left:1px;top:1px;font-size:9px;background:#5a3a10;color:#ffd86b;padding:0 2px}
.leg{color:#ff9a3c;text-shadow:0 0 6px rgba(255,140,40,.6)}
.story{white-space:pre-line;line-height:1.7;border-left:3px solid var(--gold);padding:4px 10px;margin:8px 0;color:#ece2c8}
.qrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--edge)}
.qrow.done{color:#7fe08a}
.pbar{height:6px;background:#0a0d0b;border:1px solid var(--edge);margin-top:4px}.pbar>i{display:block;height:100%;background:var(--gold)}
.btn{font:inherit;color:var(--parch);background:linear-gradient(#2b3028,#1b1f19);border:2px solid var(--edge);padding:9px 2px;font-size:13px;cursor:pointer;line-height:1.2}
.btn small{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.btn:active{transform:translateY(1px);border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.hot{border-color:var(--danger);color:#ffd4cc;background:linear-gradient(#4a1d17,#2a110d)}
.btn.on{border-color:var(--gold);color:#ffe7a3;background:linear-gradient(#4a3c18,#2a220d)}
.btn:disabled{opacity:.4}
#overlay{position:fixed;inset:0;background:rgba(4,6,4,.74);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:100%;max-width:460px;max-height:100%;overflow:auto;background:var(--panel);border:3px double var(--gold);padding:14px}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel h2{margin:0;font-size:18px;font-weight:400;color:var(--gold);letter-spacing:.06em}
.panel p{margin:0 0 10px;font-size:13px;line-height:1.7}
.close{font:inherit;font-size:12px;background:none;border:1px solid var(--edge);color:var(--dim);padding:4px 10px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--edge)}
.row .info{flex:1;min-width:0}
.nm{font-size:14px}.ds{font-size:11px;color:var(--dim);margin-top:2px}
.row .btn{padding:7px 9px;font-size:12px;flex:none}
.sect{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:14px 0 4px}
.gear{border:1px solid var(--edge);padding:10px;margin-bottom:8px;background:#131813}
.gname{font-size:16px}.e4{color:#9fd8ff}.e7{color:#ffd86b;text-shadow:0 0 6px rgba(255,200,80,.5)}
.t2{color:#8fd0ff}.t3{color:#c59bff}.t4{color:#ffb35c}
.gstat{font-size:12px;color:var(--dim);margin:3px 0 6px}
.rate{font-size:12px;margin-bottom:8px}.rate.risk{color:var(--danger)}
.gear .btn{width:100%}
#fx{text-align:center;font-size:20px;margin:6px 0;min-height:4px}
#fx.ok{color:#ffd86b;animation:pop .6s}#fx.boom{color:var(--danger);animation:shake .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 0;border-bottom:1px dashed var(--edge)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.classes{display:grid;gap:8px}
.ccard{display:flex;gap:12px;align-items:center;border:2px solid var(--edge);background:#131813;padding:10px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.ccard:hover,.ccard:focus-visible{border-color:var(--gold);outline:none}
.ccard img{width:64px;height:64px;image-rendering:pixelated;flex:none;background:#0b0e0b}
.ccard .nm{font-size:16px;color:var(--gold)}
.eqgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot,.bcell{position:relative;aspect-ratio:1;border:1px solid var(--edge);background:#0f130f;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font:inherit;color:var(--dim);min-width:0}
.slot.sel,.bcell.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.slot .lb{position:absolute;left:3px;top:2px;font-size:9px;color:var(--dim)}
.slot .en,.bcell .en{position:absolute;right:3px;bottom:2px;font-size:10px;color:#ffe7a3;text-shadow:0 1px 0 #000}
.bcell.q1{border-color:#4a7aa8}.bcell.q2{border-color:#c49a3a}.bcell.q3{border-color:#ff9a3c;box-shadow:0 0 8px rgba(255,140,40,.7)}
.bgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ic{width:32px;height:32px;image-rendering:pixelated;background-repeat:no-repeat;transform:scale(1.15)}
.ict{font-size:11px;color:var(--parch)}
.detail{border:1px solid var(--edge);background:#131813;padding:10px;margin:8px 0}
.detail .acts2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.detail .acts2 .btn{flex:1;padding:8px 6px;font-size:12px}
.stats{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;align-items:center;font-size:13px}
.stats .v{font-variant-numeric:tabular-nums;color:var(--parch);text-align:right}
.stats .btn{padding:3px 10px;font-size:13px}
.derived{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 12px;font-size:12px;color:var(--dim);margin-top:8px}
.derived b{font-weight:400;color:var(--parch);float:right;font-variant-numeric:tabular-nums}
.gsel{display:flex;gap:6px;flex:none}
.gsel button{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--edge);background:#0b0e0b;padding:4px;cursor:pointer;font:inherit;color:var(--dim);font-size:11px}
.gsel button:hover,.gsel button:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.gsel img{width:56px;height:56px;image-rendering:pixelated}
.ccard2{display:flex;gap:10px;align-items:center;border:2px solid var(--edge);background:#131813;padding:10px}
.ccard2 .nm{font-size:16px;color:var(--gold)}
.badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;font-size:10px;line-height:16px;background:var(--danger);color:#fff;border-radius:8px}
@media (prefers-reduced-motion:reduce){#fx.ok,#fx.boom{animation:none}.bar>i{transition:none}}

#log .l-log{color:var(--dim)}#log .l-sys{color:#e8c46a}#log .l-all{color:#ece2c8}#log .l-map{color:#cfd8c8}#log .l-party{color:#8fd8ff}#log .l-clan{color:#9fe09f}#log .l-w{color:#e0a0ff}
#log b{font-weight:400}
#fChat{display:flex;gap:4px}
#fChat select,#fChat input{font:inherit;font-size:16px;background:#0f130f;color:var(--parch);border:1px solid var(--edge);padding:6px 6px;min-width:0}
#fChat input{flex:1}
#fChat button{flex:none;padding:6px 10px}
.acts{grid-template-columns:repeat(6,1fr)}
.acts .btn{padding:8px 2px}
#online{font-size:10px;color:var(--dim);text-align:right}
#screen{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 20%,#1d2a1e 0%,var(--bg) 70%);overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:420px;background:var(--panel);border:3px double var(--gold);padding:18px;margin-top:6vh}
.card.wide{max-width:560px;margin-top:0}
.card h1{margin:0 0 4px;font-size:26px;font-weight:400;color:var(--gold);letter-spacing:.08em}
.card h1 small{font-size:13px;color:var(--dim);letter-spacing:.2em}
.card label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.card input,.inl input{width:100%;font:inherit;font-size:16px;background:#0f130f;color:var(--parch);border:1px solid var(--edge);padding:9px 10px}
.card input:focus,.inl input:focus,#fChat input:focus{outline:2px solid var(--gold);outline-offset:0}
.card .err{color:var(--danger);font-size:13px;margin:10px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn.ghost{background:none}
.btn.wide{width:100%}
.ccard2{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--edge);background:#131813;padding:10px}
.ccard2.sel{border-color:var(--gold)}
.ccard2 .pv{width:64px;height:64px;image-rendering:pixelated;flex:none;background:#0b0e0b}
.cinfo{min-width:0;flex:1}
.cinfo .gsel{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cinfo .gsel .btn{padding:7px 10px;font-size:12px}
.cinfo form .btn[type=submit]{width:100%;margin-top:8px}
.inl{display:flex;gap:6px;margin-top:8px}.inl input{font-size:16px;padding:7px 8px}.inl .btn{flex:none;padding:7px 12px;font-size:12px}
.num{font-variant-numeric:tabular-nums}
#status{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:#2a1d10;border:1px solid var(--gold);color:var(--parch);font-size:13px;padding:6px 12px}
#toast{position:fixed;left:50%;bottom:max(90px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:#3a1612;border:1px solid var(--danger);color:#ffd4cc;font-size:13px;padding:8px 14px;max-width:90vw}
.hud{grid-template-columns:auto 1fr auto}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="who"><div class="lv" id="lv">Lv.1</div><div class="cls" id="clsName"></div></div>
    <div class="bars">
      <div class="bar"><i id="hpF"></i><span id="hpT"></span></div>
      <div class="bar"><i id="mpF"></i><span id="mpT"></span></div>
      <div class="bar xp"><i id="xpF"></i></div>
    </div>
    <div class="gold"><i class="uic gi" style="--i:22"></i><b id="gold">0</b><div id="online"></div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="log" aria-live="polite"></div>
    <div id="joyZone" aria-hidden="true"></div><div id="joy" aria-hidden="true"><div id="joyK"></div></div>
    <div class="skpad">
      <button class="btn" id="bPot"><i class="uic" style="--i:13"></i><small id="cPot">×0</small></button>
      <button class="btn sk" id="bS2"><i class="uic ski"></i><span class="sn">技能</span><small></small><i class="cdv"></i></button>
      <button class="btn sk" id="bS1"><i class="uic ski"></i><span class="sn">技能</span><small></small><i class="cdv"></i></button>
      <button class="btn sk" id="bS0"><i class="uic ski"></i><span class="sn">技能</span><small></small><i class="cdv"></i></button>
      <button class="btn" id="bAtk"><i class="uic" style="--i:12"></i><span>攻擊</span></button>
    </div>
    <button class="btn fbtn" id="bZoom" aria-label="畫面縮放">100%</button>
  </div>
  <form id="fChat"><select id="chatCh" aria-label="頻道"><option value="map">地圖</option><option value="all">全頻</option><option value="party">隊伍</option><option value="clan">血盟</option></select><input id="chatIn" maxlength="120" placeholder="說點什麼…（/名字 訊息 = 私訊）" autocomplete="off"><button class="btn">送出</button></form>
  <div class="acts">
    <button class="btn" id="bAuto"><i class="uic mi" style="--i:14"></i>自動<small>狩獵</small></button>
    <button class="btn" id="bQuest"><i class="uic mi" style="--i:15"></i>任務<small id="cQuest">主線</small></button>
    <button class="btn" id="bBag"><i class="uic mi" style="--i:16"></i>角色<small>背包</small></button>
    <button class="btn" id="bRet"><i class="uic mi" style="--i:17"></i>回村<small id="cRet">×0</small></button>
    <button class="btn" id="bSocial"><i class="uic mi" style="--i:18"></i>社交<small>隊伍</small></button>
    <button class="btn" id="bPk"><i class="uic mi" style="--i:19"></i>PK<small>模式</small></button>
    <button class="btn" id="bChat"><i class="uic mi" style="--i:20"></i>聊天<small>輸入</small></button>
  </div>
</div>
<div id="overlay" hidden><div class="panel"><header><h2 id="pTitle"></h2><button class="close" id="pClose">關閉</button></header><div id="pBody"></div></div></div>
<div id="screen" hidden></div>
<div id="status" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
